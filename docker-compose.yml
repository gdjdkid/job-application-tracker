services:
  postgres:
    image: postgres:17
    container_name: jobtracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobtracker_db
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: